name: Release Extension

# Se dispara al pushear un tag ext-vX.Y.Z. Bumpea la "version" de
# clients/extension/manifest.json antes de taggear.
on:
  push:
    tags: ['ext-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar la extensión (.zip)
        run: |
          cd clients/extension
          zip -r "$GITHUB_WORKSPACE/passtore-extension.zip" . \
            -x 'native-host/*' 'README.md'

      - name: Adjuntar el .zip al Release
        uses: softprops/action-gh-release@v2
        with:
          files: passtore-extension.zip

      # --- Publicación a tiendas (solo si hay secretos configurados) ---
      - name: Publicar en Chrome Web Store
        if: ${{ env.CHROME_EXTENSION_ID != '' }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source passtore-extension.zip --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publicar en Edge Add-ons
        if: ${{ env.EDGE_PRODUCT_ID != '' }}
        uses: wdio-community/edge-addons-action@v1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: passtore-extension.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
